name: release-please

# Automated releases from merged PRs.
#
# On every push to main, release-please reads the Conventional Commit titles
# merged since the last release and keeps a single "release PR" open that bumps
# version.txt and updates CHANGELOG.md. Merging that release PR creates the
# vX.Y.Z tag and GitHub Release; the package job then builds and attaches the
# archives.
#
# The packaging runs here rather than via release.yml's tag trigger because a
# tag created with the workflow's own GITHUB_TOKEN doesn't trigger other
# workflows.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
