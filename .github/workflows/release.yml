name: release

# Packs the tools into release archives (git-utilities.tar.gz for macOS/Linux,
# git-utilities.zip for Windows) and attaches them to a GitHub Release. The
# fixed asset names let the installers fetch them from the stable
# /releases/latest/download/ URL.
#
# Both archives carry both flavors, as bash/ and pwsh/ subdirectories, so
# either installer can pick the one it wants.
#
# Normally this runs automatically: release-please.yml calls it after merging
# a release PR creates the release. It can also be run by hand:
#   - dispatch it with a version (creates that tag and release), or
#   - push a v* tag yourself.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and release (e.g. v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Tag of the (already created) release to attach archives to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Dispatch and workflow_call pass a version; a tag push doesn't.
          tag="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Stage scripts
        run: |
          mkdir -p dist/bash dist/pwsh
          cp src/bash/git-*.sh dist/bash/
          cp src/pwsh/git-*.ps1 dist/pwsh/
          cp LICENSE README.md dist/ 2>/dev/null || true

      - name: Create archives
        run: |
          tar -czf git-utilities.tar.gz -C dist .
          ( cd dist && zip -qr ../git-utilities.zip . )

      - name: Record checksums
        run: |
          {
            echo '### git-utilities archives'
            echo '```'
            sha256sum git-utilities.tar.gz git-utilities.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Created already (by release-please, or by hand): just attach the
            # archives and leave its notes alone.
            gh release upload "$TAG" git-utilities.tar.gz git-utilities.zip --clobber
          else
            gh release create "$TAG" git-utilities.tar.gz git-utilities.zip \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
