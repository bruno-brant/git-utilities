name: release

# Continuous delivery: pack the tools into release archives
# (git-utilities.tar.gz for macOS/Linux, git-utilities.zip for Windows) and
# attach them to a GitHub Release. The fixed asset names let the installers
# fetch them from the stable /releases/latest/download/ URL.
#
# Triggered either by pushing a version tag, or manually (workflow_dispatch)
# with a version to create — the manual path creates the tag itself, so no
# tag push is required.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage scripts
        run: |
          mkdir -p dist
          cp src/git-*.ps1 dist/
          cp LICENSE README.md dist/ 2>/dev/null || true

      - name: Create archives
        run: |
          tar -czf git-utilities.tar.gz -C dist .
          ( cd dist && zip -qr ../git-utilities.zip . )

      - name: Record checksums
        run: |
          {
            echo '### git-utilities archives'
            echo '```'
            sha256sum git-utilities.tar.gz git-utilities.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            git-utilities.tar.gz
            git-utilities.zip
          generate_release_notes: true
